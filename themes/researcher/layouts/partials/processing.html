<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
  // Dracula palette accents
  const DRACULA = [
    [255, 121, 198], // pink
    [80,  250, 123], // green
    [255, 184, 108], // orange
    [189, 147, 249], // purple
    [139, 233, 253], // cyan
    [241, 250, 140], // yellow
    [255, 85,  85],  // red
  ];

  let x, y;
  let pg;
  let palA, palB, palT;

  function pickPalIdx(exclude) {
    let i = exclude;
    while (i === exclude) i = Math.floor(Math.random() * DRACULA.length);
    return i;
  }

  function setup() {
    pixelDensity(1);
    const cnv = createCanvas(windowWidth, windowHeight);
    cnv.id('sketch');

    const displayRatio = windowWidth / windowHeight;
    pg = createGraphics(100 * displayRatio, 100);
    x = pg.width / 2;
    y = pg.height / 2;

    palA = Math.floor(Math.random() * DRACULA.length);
    palB = pickPalIdx(palA);
    palT = 0;

    pg.noSmooth();
    noSmooth();
  }

  function draw() {
    let nextX = x + random(-5, 5);
    let nextY = y + random(-5, 5);
    nextX = constrain(nextX, 0, pg.width);
    nextY = constrain(nextY, 0, pg.height);

    palT += 0.004;
    if (palT >= 1) {
      palA = palB;
      palB = pickPalIdx(palA);
      palT = 0;
    }
    const a = DRACULA[palA];
    const b = DRACULA[palB];
    const r = lerp(a[0], b[0], palT);
    const g = lerp(a[1], b[1], palT);
    const bl = lerp(a[2], b[2], palT);

    pg.stroke(r, g, bl);
    pg.line(nextX, nextY, x, y);

    image(pg, 0, 0, width, height);

    x = nextX;
    y = nextY;
  }

  function mousePressed() {
    x = pg.width * (mouseX / width);
    y = pg.height * (mouseY / height);
    palA = Math.floor(Math.random() * DRACULA.length);
    palB = pickPalIdx(palA);
    palT = 0;
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }
</script>
